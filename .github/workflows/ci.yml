name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Il nome del job ("ci") è il check richiesto dal ruleset di main.
  # Nel template (senza package.json) passa senza fare nulla; nei progetti esegue tutto.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rileva progetto Node
        id: detect
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.node == 'true'
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        if: steps.detect.outputs.node == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.node == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.detect.outputs.node == 'true'
        run: npm run typecheck --if-present

      - name: Unit test
        if: steps.detect.outputs.node == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.node == 'true'
        run: npm run build --if-present

      - name: Install Playwright browsers
        if: steps.detect.outputs.node == 'true' && hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps

      - name: E2E (Playwright)
        if: steps.detect.outputs.node == 'true' && hashFiles('playwright.config.*') != ''
        run: npm run test:e2e

      - name: Upload report Playwright
        if: always() && steps.detect.outputs.node == 'true' && hashFiles('playwright.config.*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
